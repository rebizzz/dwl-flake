name: update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Update
        run: nix run .#update 2>&1 | tee "$RUNNER_TEMP/update.log"

      - name: Open pull request
        run: |
          git add -A
          git diff --cached --quiet && exit 0

          rev() { nix flake metadata --json | jq -r ".locks.nodes.\"$1\".locked.rev[:7]"; }
          title="update: dwl $(rev dwl-src), dwl-patches $(rev dwl-patches-src)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C update
          git commit -m "$title"
          git push -f origin update

          {
            echo "Automatic update. It merges itself once every check passes."
            echo
            echo "\`\`\`"
            awk '/^•/ {p = 1; print; next} p && /^  (  '"'"'|→ )/ {print; next} {p = 0}' "$RUNNER_TEMP/update.log"
            echo "\`\`\`"
          } > "$RUNNER_TEMP/body.md"

          if ! gh pr view update --json state -q .state | grep -q OPEN; then
            gh pr create --base main --head update --title "$title" --label automated --label dependencies --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit update --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

          gh pr merge update --auto --rebase
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 18); do
            sleep 10
            runs=$(gh run list -c "$sha" -w check --json databaseId,conclusion -q ".[] | \"\\(.databaseId) \\(.conclusion)\"")
            [ -z "$runs" ] && continue
            pending=$(echo "$runs" | awk '$2 == "action_required" {print $1}')
            [ -z "$pending" ] && break
            for id in $pending; do gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/approve" || true; done
          done

          for _ in $(seq 1 90); do
            state=$(gh pr view update --json state -q .state)
            [ "$state" = OPEN ] || break
            sleep 10
          done
          if [ "$state" = MERGED ]; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/update" || true
          fi
