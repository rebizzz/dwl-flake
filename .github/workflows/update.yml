name: update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Update
        run: nix run .#update

      - name: Check
        run: nix flake check -L

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          rev() { nix flake metadata --json | jq -r ".locks.nodes.\"$1\".locked.rev[:7]"; }
          git commit -m "update: dwl $(rev dwl-src), dwl-patches $(rev dwl-patches-src)"
          git push
