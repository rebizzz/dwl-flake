name: update

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Update
        run: nix run .#update

      - name: Open pull request
        run: |
          git add -A
          git diff --cached --quiet && exit 0

          rev() { nix flake metadata --json | jq -r ".locks.nodes.\"$1\".locked.rev[:7]"; }
          title="update: dwl $(rev dwl-src), dwl-patches $(rev dwl-patches-src)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C update
          git commit -m "$title"
          git push -f origin update

          if ! gh pr view update --json state -q .state | grep -q OPEN; then
            gh pr create --base main --head update --title "$title" --label automated \
              --body "Automatic update of flake.lock and nix/patches.json. Merges itself once every check passes." \
              || gh pr create --base main --head update --title "$title" \
                --body "Automatic update of flake.lock and nix/patches.json. Merges itself once every check passes."
          else
            gh pr edit update --title "$title"
          fi

          gh pr merge update --auto --rebase
          gh workflow run check.yml --ref update
