name: cleanup

on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [update]

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-branch:
    if: github.event_name == 'workflow_run' || github.event.pull_request.head.ref == 'update'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          for _ in $(seq 1 12); do
            gh api "repos/$GH_REPO/branches/update" --silent 2>/dev/null || exit 0
            if [ -z "$(gh pr list --head update --state open --json number -q '.[].number')" ]; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/update"
              exit 0
            fi
            sleep 10
          done
